<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="url(#gkGrad)" stroke-width="2.5" />
  <!-- Monogram Logo -->
  <text x="32" y="41" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="url(#gkGrad)" letter-spacing="-0.5">GK</text>
  <!-- Tech accent dot -->
  <circle cx="50" cy="16" r="3.5" fill="#10b981" />
</svg>
